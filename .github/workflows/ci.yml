name: CI

# Verifies every push and pull request. This workflow validates only; it never
# deploys. Deployment (Cloudflare Pages, Railway) is deferred to a later milestone.
on:
  push:
  pull_request:

# Cancel superseded runs on the same ref so CI reflects the latest commit only.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      - name: Integration tests
        run: pnpm run test:integration

      - name: Production builds
        run: pnpm run build

  # Separate from `verify` by design (docs/DECISIONS.md D32): a real Chromium
  # instance, animation-frame timing, and live-enemy navigation are slower and
  # more failure-prone than the six fast, deterministic gates above, and must
  # never block or slow that job's signal.
  browser:
    name: Browser end-to-end (Playwright)
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright's Chromium (with OS dependencies)
        run: pnpm --filter @carry-or-fall/client exec playwright install --with-deps chromium

      - name: Browser end-to-end tests
        run: pnpm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/client/playwright-report/
          retention-days: 7
