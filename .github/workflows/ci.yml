name: CI

# Verifies the default branch and every pull request. This workflow validates
# only; it never deploys. Deployment (Cloudflare Pages, Railway) is deferred to a
# later milestone.
#
# `push` is limited to `main` on purpose. Previously it was unrestricted, so a
# branch that had an open pull request ran the whole workflow twice for one
# commit — once for the branch push and once for the pull request — including two
# ten-minute browser jobs that could only ever agree with each other. Narrowing
# the trigger removes the duplicate at its source; the concurrency group below
# then handles the remaining case, superseded commits on the same branch.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs so CI reflects the latest commit only. Keyed on the head
# branch rather than `github.ref`, because for a pull request `github.ref` is the
# merge ref (`refs/pull/N/merge`) while for a push it is the branch — different
# strings for the same branch, which is exactly the case that needs to collapse
# into one group.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      - name: Integration tests
        run: pnpm run test:integration

      - name: Production builds
        run: pnpm run build

  # Separate from `verify` by design (docs/DECISIONS.md D32): a real Chromium
  # instance, animation-frame timing, and live-enemy navigation are slower and
  # more failure-prone than the six fast, deterministic gates above, and must
  # never block or slow that job's signal.
  browser:
    name: Browser end-to-end (Playwright)
    runs-on: ubuntu-latest
    # A ceiling, not a target: the suite takes roughly ten minutes of real
    # browser time, and Playwright's own `maxFailures` stops a broken run long
    # before this. It exists so a hang — a dev server that never binds, a page
    # that never loads — is cut off and reported instead of running until
    # GitHub's six-hour default.
    timeout-minutes: 25
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright's Chromium (with OS dependencies)
        run: pnpm --filter @carry-or-fall/client exec playwright install --with-deps chromium

      - name: Browser end-to-end tests
        run: pnpm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/client/playwright-report/
          retention-days: 7
